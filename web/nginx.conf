server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: hash routing is used, but keep history fallback safe anyway.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin API so the profile cookie works without CORS or SameSite games.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # the first ranking for a new profile builds walks and can take a while
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
